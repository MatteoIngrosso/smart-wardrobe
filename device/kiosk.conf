# Smart Wardrobe wall screen settings. Edit, then restart the screen (or run: wardrobe-kiosk restart).

# The page the screen opens.
URL="https://smart-wardrobe.matteo08-ingrosso.workers.dev"

# Turn the screen off after this many minutes without a touch (0 = never). A touch wakes it.
BLANK_MINUTES=5

# Screen direction: normal (portrait, how the 10.1" Pi screen comes), 90, 180 or 270.
ROTATION=normal

# Restart the browser every night at this hour (0-23) to keep it fresh. Empty = never.
NIGHTLY_RESTART_HOUR=4

# 1 = make Chromium draw with the graphics chip (smooth 3D mirror). Set 0 if the screen
# flickers or shows stripes, then restart.
GPU_BOOST=1

# Extra Chromium switches, separated by spaces (for trying things out). Empty = none.
EXTRA_FLAGS=""
